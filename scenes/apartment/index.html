<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110d"><meta name="description" content="一间被暖光照亮的公寓。依据模型预览在 Blender 中重建，在浏览器中旋转总览，或进入房间自由漫步。">
<title>暖夜公寓 · 空间漫游</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23221e17'/%3E%3Cpath d='M14 43V24l18-9 18 9v19l-18 9zM14 24l18 9 18-9M32 33v19' fill='none' stroke='%23d9b981' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<main id="experience" aria-label="暖夜公寓三维空间">
 <div id="scene"></div>
 <div id="loading"><img src="./assets/poster.jpg" alt="暖色灯光下的公寓鸟瞰模型"><div class="loading-label"><span>正在点亮房间</span><span id="loadProgress">0%</span><div class="loading-track"><i id="loadBar"></i></div></div></div>
 <div class="edge-shade" aria-hidden="true"></div>
 <header>
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m6 13 14-7 14 7v15l-14 7-14-7zm0 0 14 7 14-7M20 20v15M13 17v14"/></svg><div><h1>暖夜公寓</h1><p>AMBER ROOM <span>·</span> 空间漫游</p></div></div>
  <div class="header-actions"><span class="night-label"><i></i> 暖夜</span><button id="referenceBtn" class="ghost" aria-label="查看模型预览"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 5 5 3-3 5 5"/><circle cx="16" cy="9" r="1.4"/></svg><span>模型预览</span></button></div>
 </header>
 <div id="crosshair" aria-hidden="true"></div>
 <div id="walkHint" class="walk-hint" hidden>点击画面环顾 <span>·</span> W A S D 移动 <span>·</span> Esc 释放鼠标</div>
 <div id="toast" role="status" aria-live="polite"></div>
 <footer>
  <div class="scene-caption"><div class="eyebrow">A QUIET EVENING</div><p id="modeCaption">从一盏灯，走进一个家。</p><span id="controlsCaption">拖动旋转 <b>·</b> 滚轮缩放</span></div>
  <nav class="mode-switch" aria-label="观看方式">
   <button id="overviewBtn" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m3 8 9-4 9 4-9 4zm0 4 9 4 9-4M3 16l9 4 9-4"/></svg>鸟瞰总览</button>
   <button id="walkBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 21V4l10-2v19M5 21h16M14 12h.01"/></svg>进入房间</button>
  </nav>
  <button id="resetBtn" class="reset ghost" aria-label="回到初始视角"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg><span>重置视角</span></button>
 </footer>
 <aside id="minimap" hidden aria-label="当前位置"><span>你在这里</span><svg id="map" viewBox="-7.8 -6.7 15.6 11.8"><g id="mapPlan"></g><g id="mapMarker"><circle r=".42" class="marker-aura"/><path d="M0 -.36 .19 .2 0 .1 -.19 .2z"/></g></svg></aside>
 <div id="touchControls" hidden><div id="joystick" aria-label="拖动摇杆移动"><i id="stick"></i></div><div class="touch-look-hint">右侧滑动环顾</div></div>
 <dialog id="referenceDialog"><div class="dialog-header"><div><span class="eyebrow">MODEL PREVIEW</span><h2>模型预览</h2></div><button id="closeReference" aria-label="关闭模型预览">×</button></div><img src="./assets/poster.jpg" alt="暖夜公寓模型渲染预览"><p>依据单张图片重建。不可见的结构与实际尺寸按比例推定。</p></dialog>
 <div id="errorPanel" hidden><h2>暂时无法打开三维场景</h2><p id="errorText"></p><button onclick="location.reload()">重新加载</button></div>
</main>
<script type="module" src="./app.js"></script>
</body></html>
